services:
  - type: web
    name: sscix-web
    runtime: docker
    region: frankfurt
    plan: starter
    dockerContext: ./web
    dockerfilePath: ./web/Dockerfile
    healthCheckPath: /api/v1/health
    dockerCommand: >-
      sh -c 'export API_INTERNAL_URL="http://${API_INTERNAL_HOSTPORT:?}";
      exec npm start -- --hostname 0.0.0.0'
    envVars:
      - key: PORT
        value: "3000"
      - key: API_INTERNAL_HOSTPORT
        fromService:
          type: pserv
          name: sscix-api
          property: hostport

  - type: pserv
    name: sscix-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: sscix-db
          property: connectionString
      - key: APP_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "1"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: sscix-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: sscix
    user: sscix
    ipAllowList: []
